[pytest]
# pythonpath = . so a bare `pytest` works, not only `python -m pytest`.
# Without it, `docker compose exec backend pytest` fails every import with
# "No module named 'app'" -- `python -m` implicitly prepends the cwd to
# sys.path and a bare `pytest` does not. Every test docstring in this repo
# documents the bare form, so make the documented command actually work.
pythonpath = .
testpaths = tests
# Markers so CI can run the fast tier without a database. "integration"
# means: needs real Postgres/Qdrant/Supabase, or imports app.main (which
# makes a real boto3 call at import time).
markers =
    integration: requires real infrastructure (Postgres, Qdrant, object storage)
